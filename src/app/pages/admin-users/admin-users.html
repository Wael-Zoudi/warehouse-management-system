<div class="admin-page">

  <div class="admin-header">
    <div>
      <h2>Benutzerverwaltung</h2>
      <p>Benutzer freigeben, Rollen verwalten und Konten löschen.</p>
    </div>
  </div>

  <div class="users-table-wrapper">
    <table class="users-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Benutzername</th>
          <th>Rolle</th>
          <th>Freigegeben</th>
          <th>Aktionen</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.id }}</td>

          <td class="username-cell">
            {{ user.username }}
          </td>

          <td>
            <span class="role-pill" [class.role-admin]="user.role === 'Admin'">
              {{ user.role }}
            </span>
          </td>

          <td>
            <span *ngIf="user.isApproved" class="status-approved">
              ✅ Ja
            </span>

            <span *ngIf="!user.isApproved" class="status-pending">
              ❌ Nein
            </span>
          </td>

          <td>
            <div class="action-buttons">
              <button
                class="btn btn-approve"
                *ngIf="!user.isApproved"
                (click)="approveUser(user)">
                Freigeben
              </button>

              <button
                class="btn btn-admin"
                *ngIf="user.role !== 'Admin'"
                (click)="makeAdmin(user)">
                Admin machen
              </button>

              <button
                class="btn btn-delete"
                *ngIf="user.role !== 'Admin'"
                (click)="rejectUser(user)">
                Löschen
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
